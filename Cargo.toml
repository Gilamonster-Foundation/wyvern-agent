# wyvern-agent — the lightest headless worker (flight tier).
# True minimalism: the stripped essence of an agentic loop, fewest deps.
[workspace]
resolver = "2"
members = ["wyvern-runtime", "wyvern"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gilamonster-Foundation/wyvern-agent"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP, no async runtime — a flight-tier agent makes one request at a
# time, so tokio/reqwest would be dead weight.
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
opt-level = "z"   # optimize for SIZE — the flight tier is meant to be tiny
lto = true
codegen-units = 1
strip = true
panic = "abort"
