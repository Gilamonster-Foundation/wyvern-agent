name: CI

# HOOK PARITY: This workflow mirrors `.githooks/pre-push` and the `check`
# recipe in justfile (fmt-check + clippy + test + no-vendor). When editing
# this file, audit the hook + justfile in the same PR.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "*/scaffold", "phase-*", "release/**"]
  pull_request:
    branches: ["main"]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test --workspace` runs the unit/integration suite INCLUDING the
      # `no_vendor` guard — the charter HARD RULE that no vendor identity names
      # appear in non-test src.
      - name: cargo test
        run: cargo test --workspace --locked
